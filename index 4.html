<meta name="theme-color" content="#ff6b9d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Aşkımın Eczanesi">
<style>
:root{--bg:#f4f7f2;--fg:#1b2a1b;--card:#fff;--cell:#e6efe0;--sel:#ffb703;--acc:#2a9d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a12;--fg:#e8f3e8;--card:#1a2a1d;--cell:#243a28;--sel:#ffb703;--acc:#4cc777}}
:root[data-theme="dark"]{--bg:#101a12;--fg:#e8f3e8;--card:#1a2a1d;--cell:#243a28;--sel:#ffb703;--acc:#4cc777}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:6px;box-sizing:border-box;user-select:none;-webkit-user-select:none}
h1{font-size:20px;margin:4px 0 8px}
.bar{display:flex;gap:10px;width:min(100vw - 12px,600px);margin-bottom:8px}
.bar div{flex:1;background:var(--card);border-radius:12px;padding:6px 10px;text-align:center;font-size:12px}
.bar b{display:block;font-size:20px;color:var(--acc)}
#row{display:flex;gap:6px;width:min(100vw - 12px,600px);align-items:flex-start;flex-shrink:0}
#wrap{position:relative;flex:1;min-width:0}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;background:var(--card);padding:4px;border-radius:14px;touch-action:none;font-size:calc(min(100vw - 12px,600px)/8*.62)}
.c{aspect-ratio:1;background:var(--cell);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;line-height:1}
.c.sel{outline:3px solid var(--sel)}
.c.pop{animation:pop .28s forwards}
@keyframes pop{to{transform:scale(0);opacity:0}}
.sp{background:linear-gradient(135deg,#ffd166,#ef8354)}
.cr{background:linear-gradient(135deg,#fff0f5,#f8bbd0)}
.c svg{width:82%;height:82%}
.c.b{padding-bottom:.28em}
.c.b svg{width:68%;height:68%}
.chip span svg{width:18px;height:18px}
.c i{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-style:normal;font-size:.27em;font-weight:700;color:#222;white-space:nowrap;overflow:hidden}
#col{display:flex;flex-wrap:wrap;gap:4px;width:min(100vw - 12px,600px);margin-top:8px}
.chip{flex:0 0 calc(20% - 4px);padding:4px 0;border-radius:10px;color:#222;display:flex;flex-direction:column;align-items:center;font-size:15px;line-height:1.1}
.chip b{font-size:11px}.chip small{font-size:9px}
.chip.rdy{animation:rd .6s infinite alternate;outline:3px solid #ff3d71}
@keyframes rd{to{transform:scale(1.08)}}
#toast{position:absolute;top:-4px;left:0;right:0;text-align:center;z-index:6;pointer-events:none;opacity:0;font-weight:800;color:#fff;background:#ff3d71;border-radius:12px;padding:6px;margin:0 10%}
#toast.show{animation:ts 2s}
@keyframes ts{0%{opacity:0;transform:translateY(-10px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
.sp small{position:absolute;right:2px;bottom:0;font-size:.4em}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;font-size:clamp(22px,7vw,34px);font-weight:900;color:#ff3d71;text-shadow:0 2px 0 #fff,0 0 12px #fff;opacity:0}
#msg.show{animation:sh 1.1s}
@keyframes sh{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
#over{position:absolute;inset:0;background:#000b;color:#fff;border-radius:14px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:22px;font-weight:700}
button{font:inherit;font-size:16px;padding:10px 22px;border:0;border-radius:12px;background:var(--acc);color:#fff}
.lg{font-size:12px;opacity:.8;width:min(100vw - 12px,600px);margin-top:10px;line-height:1.5}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.beam{position:absolute;pointer-events:none;z-index:4;opacity:0;background:linear-gradient(90deg,transparent,#fff,#ffd166,#fff,transparent);box-shadow:0 0 18px 6px #ffd166;animation:bH .55s ease-out}
.beam.v{background:linear-gradient(180deg,transparent,#fff,#ffd166,#fff,transparent);animation:bV .55s ease-out}
@keyframes bH{0%{transform:scaleX(0);opacity:1}60%{opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes bV{0%{transform:scaleY(0);opacity:1}60%{opacity:1}100%{transform:scaleY(1);opacity:0}}
.ring{position:absolute;border-radius:50%;border:5px solid #ff6b9d;box-shadow:0 0 24px #ff6b9d,inset 0 0 24px #ff6b9d;transform:translate(-50%,-50%) scale(.1);animation:rg .65s ease-out forwards;z-index:4;pointer-events:none}
@keyframes rg{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.flash{position:absolute;inset:0;border-radius:14px;z-index:4;pointer-events:none;animation:fl .6s ease-out forwards}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px) rotate(-.6deg)}40%{transform:translate(6px,-4px) rotate(.6deg)}60%{transform:translate(-4px,-3px)}80%{transform:translate(4px,3px)}}
.sp{animation:gl 1.2s infinite alternate}
@keyframes gl{from{box-shadow:0 0 4px #ffd166}to{box-shadow:0 0 14px #ff9f1c}}
.born{animation:born .5s}
@keyframes born{0%{transform:scale(.2) rotate(-120deg)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.bar button{padding:2px 6px;background:transparent;font-size:26px}
#wrap,#col,.bar,.lg,h1{flex-shrink:0}
#board{aspect-ratio:1/1;box-sizing:border-box;grid-template-rows:repeat(8,1fr)}
.c{min-height:0;overflow:hidden}
.shp{width:44px;padding:4px 0;border-radius:12px;background:var(--card);color:var(--fg);display:flex;flex-direction:column;align-items:center;font-size:20px;line-height:1.1;border:2px solid transparent}
#shop{display:flex;flex-direction:column;gap:6px;width:44px;flex-shrink:0}
.shp svg{width:24px;height:24px}.shp b{font-size:11px;color:var(--acc)}.shp small{font-size:8px}
.shp.off{opacity:.4}.shp.on{border-color:#ff3d71;animation:rd .6s infinite alternate}
h1{color:var(--acc)}#board{border:3px solid var(--acc)}.shp.on{animation:none;border-color:var(--acc)}
body{background-image:var(--grad,none);background-attachment:fixed}
h1,.bar,#row,#col{position:relative;z-index:1}
#deco{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.fl{position:absolute;bottom:-50px;opacity:.55;pointer-events:none;animation:fup linear infinite}
@keyframes fup{to{transform:translateY(-115vh) rotate(40deg)}}
#msg{font-family:'Snell Roundhand','Segoe Script','Brush Script MT',cursive;color:var(--acc);font-size:clamp(26px,8.5vw,44px);padding:0 10px;text-shadow:0 0 14px #fff,0 2px 0 #fff}
#board{box-shadow:0 6px 22px rgba(0,0,0,.18)}
#start{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);background-image:var(--grad,none);overflow:hidden}
#start.hide{display:none}
#sdeco{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sbox{position:relative;text-align:center;padding:20px;width:min(88vw,380px)}
.logo{font-size:70px}.sbox h2{color:var(--acc);margin:6px 0 22px;font-size:28px}
#play{font-size:30px;font-weight:800;padding:16px 70px;border-radius:40px;background:var(--acc);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.tl{margin:30px 0 10px;font-weight:700;color:var(--fg)}
#themes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.th{width:78px;padding:10px 0;border-radius:16px;background:var(--card);color:var(--fg);font-size:30px;display:flex;flex-direction:column;align-items:center;border:3px solid transparent;line-height:1.1}
.th small{font-size:12px;margin-top:4px}.th.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,255,255,.6)}
#pay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
#pay.hide{display:none}
.pbox{background:var(--card);color:var(--fg);border-radius:20px;padding:18px;width:min(88vw,360px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.pbox h3{margin:0 0 8px;color:var(--acc)}.pbox p{margin:0 0 10px;font-size:15px}
#plist{max-height:110px;overflow:auto;font-size:14px;color:var(--acc);margin-bottom:8px}
#pin{width:100%;box-sizing:border-box;font-size:17px;padding:10px;border-radius:12px;border:2px solid var(--acc);background:#fff;color:#222}
.pc{margin:8px 0;font-weight:700;min-height:20px}.pb{display:flex;gap:8px;justify-content:center}
#pno{background:#999}
#win{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center}
#win.hide{display:none}
.wbox{background:var(--card);border-radius:22px;padding:14px;text-align:center;width:min(86vw,340px);animation:pw .6s;box-shadow:0 0 40px var(--acc)}
.wbox img{width:100%;border-radius:14px;display:block}.wbox h2{color:var(--acc);margin:12px 0}
@keyframes pw{from{transform:scale(.3);opacity:0}}

  [[1,1],[2,.45],[3,.2],[4,.08]].forEach(([m,a])=>{const o=AC.createOscillator(),gg=AC.createGain();o.frequency.value=f*m;gg.gain.value=a;o.connect(gg);gg.connect(g0);o.start(t);o.stop(t+d)})}
const BEAT=.8,mf=m=>440*Math.pow(2,(m-69)/12);
const BARS=[{b:45,c:[60,64,69],m:[[0,76,2],[2,74,1]]},{b:41,c:[57,60,65],m:[[0,72,2],[2,69,1]]},{b:48,c:[60,64,67],m:[[0,67,1],[1,72,1],[2,76,1]]},{b:43,c:[59,62,67],m:[[0,74,2],[2,71,1]]},
{b:45,c:[60,64,69],m:[[0,69,1],[1,72,1],[2,76,1]]},{b:50,c:[57,62,65],m:[[0,77,2],[2,76,1]]},{b:40,c:[56,59,64],m:[[0,74,1],[1,71,1],[2,68,1]]},{b:45,c:[57,60,64],m:[[0,69,3]]}];
function sched(){if(!AC||muted)return;while(nextT<AC.currentTime+.5){const bar=BARS[Math.floor(step/3)%BARS.length],bt=step%3;
  if(bt===0)piano(mf(bar.b),nextT,2.6,.1);else bar.c.forEach(m=>piano(mf(m),nextT,1.2,.035));
  bar.m.forEach(([o,m,d])=>{if(o===bt)piano(mf(m),nextT,d*BEAT+.9,.11)});
  nextT+=BEAT;step++}}
function startMusic(){if(musicOn||!audio())return;musicOn=true;nextT=AC.currentTime+.1;setInterval(sched,150)}
function sfx(k,n){const a=audio();if(!a||muted)return;const t=a.currentTime;
  if(k==='chime'){const S=[523.25,587.33,659.25,783.99,880,1046.5,1174.66],f=S[Math.min(n,6)];piano(f,t,1.1,.14);piano(f*1.5,t+.08,.9,.08)}
  else{const o=a.createOscillator(),g1=a.createGain();o.connect(g1);g1.connect(a.destination);
    const c={whoosh:['sawtooth',1500,200,.4,.06],boom:['sine',150,35,.5,.35],siu:['triangle',250,1000,.7,.15]}[k];
    o.type=c[0];o.frequency.setValueAtTime(c[1],t);o.frequency.exponentialRampToValueAtTime(c[2],t+c[3]);g1.gain.setValueAtTime(c[4],t);g1.gain.exponentialRampToValueAtTime(.0001,t+c[3]);o.start(t);o.stop(t+c[3]+.05)}}
$('mu').onclick=()=>{muted=!muted;$('mu').textContent=muted?'🔇':'🔊';if(!muted&&AC){nextT=AC.currentTime+.1}startMusic()};
const TH_={pembe:{n:'Pembe',e:'🩷',bg:'#ffe0ec',fg:'#5a1030',card:'#fff0f6',cell:'#ffd0e2',acc:'#e91e63',grad:'linear-gradient(160deg,#ffd0e4,#fff0f7 50%,#ffbcd8)',em:['💗','🎀','🌷']},
 cicek:{n:'Çiçekli',e:'🌸',bg:'#eaf7e0',fg:'#1f3d1f',card:'#f6fff0',cell:'#d9f0c8',acc:'#e0457b',grad:'linear-gradient(160deg,#d8f3c6,#f8fff2 50%,#ffdcec)',em:['🌸','🌷','🌼','🌺']},
 okyanus:{n:'Okyanus',e:'🌊',bg:'#d6f0fb',fg:'#0b3550',card:'#eaf9ff',cell:'#bfe6f5',acc:'#0288d1',grad:'linear-gradient(180deg,#b5e6fa,#e4f8ff 45%,#86d0ee)',em:['🌊','🐠','🐚','🫧']}};
let cur='';try{cur=localStorage.getItem('aeTheme')||''}catch(e){}
const DEFEM=['❤️','💊'];
function fillDeco(el,em){el.innerHTML='';for(let i=0;i<16;i++){const s=document.createElement('span');s.className='fl';s.textContent=em[i%em.length];s.style.cssText=`left:${Math.random()*96}%;font-size:${18+Math.random()*20}px;animation-duration:${9+Math.random()*9}s;animation-delay:-${Math.random()*16}s`;el.appendChild(s)}}
function themeUI(){$('themes').innerHTML=[['','Klasik','💊']].concat(Object.keys(TH_).map(k=>[k,TH_[k].n,TH_[k].e])).map(([k,n,e])=>`<button class="th${cur===k?' on':''}" data-k="${k}">${e}<small>${n}${k&&!owned[k]?' 🔒':''}</small></button>`).join('')}
function applyTheme(){const r=document.documentElement.style,t=TH_[cur],K=['bg','fg','card','cell','acc','grad'];
  K.forEach(k=>r.removeProperty('--'+k));if(t)K.forEach(k=>r.setProperty('--'+k,t[k]));
  const em=t?t.em:DEFEM;fillDeco($('deco'),em);fillDeco($('sdeco'),em);themeUI()}
let owned={};try{owned=JSON.parse(localStorage.getItem('aeOwned')||'{}')}catch(e){}
if(cur&&!owned[cur])cur='';
const norm=s=>s.toLocaleLowerCase('tr').replace(/ı/g,'i').replace(/ç/g,'c').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/[^a-z]/g,'');
let payK=null,payN=0;
function openPay(k){payK=k;payN=0;$('plist').innerHTML='';$('pc').textContent='0/10';$('pt').textContent=TH_[k].e+' '+TH_[k].n+' teması';$('pin').value='';$('pay').classList.remove('hide');setTimeout(()=>$('pin').focus(),100)}
function payGo(){if(payK===null||payN>=10)return;
  if(norm($('pin').value)!=='kocamicokseviyorum'){$('pc').textContent='Tam olarak "Kocamı çok seviyorum" yaz 😊';return}
  payN++;const d=document.createElement('div');d.textContent=payN+'. Kocamı çok seviyorum '+TH_[payK].em[0];$('plist').prepend(d);
  $('pin').value='';$('pc').textContent=payN+'/10';
  if(payN>=10){const k=payK;owned[k]=true;cur=k;try{localStorage.setItem('aeOwned',JSON.stringify(owned));localStorage.setItem('aeTheme',cur)}catch(x){}
    $('pc').textContent='🎉 Tema açıldı!';applyTheme();setTimeout(()=>{$('pay').classList.add('hide');payK=null},1100)}}
$('pok').onclick=payGo;$('pno').onclick=()=>{$('pay').classList.add('hide');payK=null};
$('pin').addEventListener('keydown',ev=>{if(ev.key==='Enter')payGo()});
$('themes').addEventListener('click',ev=>{const b=ev.target.closest('.th');if(!b)return;const k=b.dataset.k;
  if(!k||owned[k]){cur=k;try{localStorage.setItem('aeTheme',cur)}catch(x){}applyTheme()}else openPay(k)});
function showWin(){$('win').classList.remove('hide');sfx('siu');sfx('chime',6)}
$('wok').onclick=()=>$('win').classList.add('hide');
$('play').onclick=()=>{startMusic();$('start').classList.add('hide')};
$('tb').onclick=()=>$('start').classList.remove('hide');
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}
function chips(){$('col').innerHTML=D.map((d,t)=>{const r=cnt[t]>=TH[t];return `<button class="chip${r?' rdy':''}" data-t="${t}" style="background:${d.c}"><span>${d.e}</span><b>${r?'PATLAT!':Math.min(cnt[t],TH[t])+'/'+TH[t]}</b><small>${d.n}${t===9?' 🎁':t===8?' ⭐':''}</small></button>`}).join('')}
$('col').addEventListener('click',async e=>{const b=e.target.closest('.chip');if(!b||busy)return;startMusic();const t=+b.dataset.t;if(cnt[t]<TH[t])return;
  const set=new Set();g.forEach((v,j)=>{if(v===t)set.add(j)});if(!set.size){toast('Ekranda '+D[t].n+' yok');return}
  busy=true;cnt[t]-=TH[t];
  if(t<9){const up=[...set];up.forEach(j=>g[j]=t+1);score+=up.length*10;render(null,new Set(up));up.forEach(j=>burst(j,TC[t+1],6));flash('rgba(255,120,170,.4)');shake();sfx('chime',5);toast(D[t].n+' → '+D[t+1].n+' ⬆️');await sleep(600);await resolve([])}
  else{flash('rgba(255,120,170,.4)');ring(36,14);shake();sfx('boom');toast(D[t].n+' patlaması! 💥');noCount=true;await applyClear(set,new Map(),2);noCount=false;await resolve([])}
  busy=false;chips()});
function hasMove(){if(g.some(v=>v>=10))return true;
  const ok=()=>{const r=runs();return r.H.length||r.V.length};
  for(let i=0;i<N*N;i++)for(const j of [i+1,i+N]){if(j>=N*N||(j===i+1&&i%N===N-1))continue;
    [g[i],g[j]]=[g[j],g[i]];const m=ok();[g[i],g[j]]=[g[j],g[i]];if(m)return true}
  return false}
function fixBoard(){if(hasMove())return;
  for(let n=0;n<60;n++){for(let i=g.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[g[i],g[j]]=[g[j],g[i]]}
    const r=runs();if(!r.H.length&&!r.V.length&&hasMove())break}
  toast('Karıştırıldı 🔀');render()}
function init(){
  won=false;applyTheme();g=[];S=Array(N*N).fill(0);cnt=Array(10).fill(0);score=0;moves=40;busy=false;sel=null;
  for(let i=0;i<N*N;i++){let t;do{t=rnd()}while((i%N>1&&g[i-1]===t&&g[i-2]===t)||(i>=2*N&&g[i-N]===t&&g[i-2*N]===t));g[i]=t}
  $('over').style.display='none';render();
}
function render(pop,born){
  let h='';
  for(let i=0;i<N*N;i++){const t=g[i];let c='c'+(sel===i?' sel':'')+(pop&&pop.has(i)?' pop':'')+(born&&born.has(i)?' born':''),x='';
    let sty='';if(t<10){c+=' b';x=B[t]+'<i>'+D[t].n+'</i>';sty=` style="background:${D[t].c}"`}
    else if(t<12){c+=' sp';x='🌹<small>'+(t===10?'↔':'↕')+'</small>'}
    else if(t===12){c+=' sp';x='❤️'}
    else{c+=' sp cr';x=PEONY}
    h+=`<div class="${c}" data-i="${i}"${sty}>${x}</div>`}
  $('board').innerHTML=h;$('sc').textContent=score;$('mv').textContent=moves;chips();if(score>=30000&&!won){won=true;showWin()}
}
function runs(){
  const H=[],V=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){const t=g[r*N+c];if(t<10){let e=c;while(e+1<N&&g[r*N+e+1]===t)e++;if(e-c>=2){const a=[];for(let k=c;k<=e;k++)a.push(r*N+k);H.push(a)}c=e+1}else c++}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const t=g[r*N+c];if(t<10){let e=r;while(e+1<N&&g[(e+1)*N+c]===t)e++;if(e-r>=2){const a=[];for(let k=r;k<=e;k++)a.push(k*N+c);V.push(a)}r=e+1}else r++}}
  return{H,V};
}
function find(pref){
  const{H,V}=runs();if(!H.length&&!V.length)return null;
  const hs=new Set(H.flat()),vs=new Set(V.flat()),clear=new Set(),spawn=new Map();
  const pos=run=>{const p=(pref||[]).find(i=>run.includes(i));return p!==undefined?p:run[Math.floor(run.length/2)]};
  const handle=(run,horiz)=>{
    const t=g[run[0]];run.forEach(i=>clear.add(i));
    const inter=run.find(i=>hs.has(i)&&vs.has(i));
    const sp=(p,v)=>{spawn.set(p,v);S[p]=t};
    if(inter!==undefined)sp(inter,12);
    else if(run.length>=5)sp(pos(run),13);
    else if(run.length===4)sp(pos(run),horiz?10:11);
    else if(t<9)spawn.set(pos(run),t+1);
    else score+=100;
  };
  H.forEach(r=>handle(r,true));V.forEach(r=>handle(r,false));
  return{clear,spawn};
}
function area(i,t){
  const r=Math.floor(i/N),c=i%N,s=[];
  if(t===10)for(let k=0;k<N;k++)s.push(r*N+k);
  else if(t===11)for(let k=0;k<N;k++)s.push(k*N+c);
  else if(t===12){for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const y=r+a,x=c+b;if(y>=0&&y<N&&x>=0&&x<N)s.push(y*N+x)}}
  else{const ty=g.filter(v=>v<10);const pick=ty.length?ty[Math.floor(Math.random()*ty.length)]:0;g.forEach((v,j)=>{if(v===pick)s.push(j)});s.push(i)}
  return s;
}
function msg(t){const m=$('msg'),em=(TH_[cur]||{em:DEFEM}).em,x=(String(t).match(/x\d+/)||[''])[0];m.textContent=em[0]+" Rana'yı çok seviyorum "+em[1]+(x?' '+x:'');m.classList.remove('show');void m.offsetWidth;m.classList.add('show')}
async function applyClear(set,spawn,combo){
  const q=[...set];
  while(q.length){const i=q.pop();if(g[i]>=10)area(i,g[i]).forEach(j=>{if(!set.has(j)){set.add(j);q.push(j)}})}
  const gone=new Set([...set].filter(i=>!spawn.has(i)));
  score+=set.size*10*combo;
  if(!noCount)set.forEach(i=>{const t=g[i];if(t<10){cnt[t]++;if(t===9&&cnt[9]>=TH[9]){cnt[9]=0;moves+=5;score+=1000;toast('Coraspin: +5 hamle ve +1000 puan! 🎁');flash('rgba(255,215,0,.35)');sfx('chime',6)}else if(t===8&&cnt[8]>=TH[8]){cnt[8]=0;score+=300;toast('Voltaren: +300 puan! ⭐');sfx('chime',5)}else if(cnt[t]===TH[t])toast(D[t].n+' patlaması hazır! 💥')}});
  msg('Rana\'yı çok seviyorum ❤️'+(combo>1?' x'+combo:''));
  sfx('chime',combo-1);
  if(pending){pending();pending=null}
  set.forEach(i=>{const t=g[i];
    if(t===10){beam(i,false);sfx('whoosh')}
    else if(t===11){beam(i,true);sfx('whoosh')}
    else if(t===12){ring(i,3.5);shake();sfx('boom')}
    else if(t===13){flash('rgba(255,215,0,.5)');ring(i,9);shake();sfx('siu')}});
  gone.forEach(i=>burst(i,g[i]<10?TC[g[i]]:'#ffd166',g[i]>=10?14:6));
  if(set.size>=14){shake();flash('rgba(255,255,255,.35)')}
  render(gone);await sleep(300);
  spawn.forEach((t,i)=>g[i]=t);gone.forEach(i=>g[i]=null);
  for(let c=0;c<N;c++){const col=[];for(let r=N-1;r>=0;r--)if(g[r*N+c]!==null)col.push([g[r*N+c],S[r*N+c]]);
    for(let r=N-1;r>=0;r--){const e=col[N-1-r];g[r*N+c]=e?e[0]:rnd();S[r*N+c]=e?e[1]:0}}
  render(null,new Set(spawn.keys()));await sleep(250);
}
async function resolve(pref){
  let combo=0,m;
  while((m=find(pref))){pref=[];combo++;await applyClear(m.clear,m.spawn,combo)}
}
async function trySwap(a,b){
  busy=true;sel=null;
  [g[a],g[b]]=[g[b],g[a]];[S[a],S[b]]=[S[b],S[a]];render();await sleep(150);
  const ta=g[a],tb=g[b];
  if(ta>=10||tb>=10){
    moves--;const set=new Set();
    const sa=ta>=10,sb=tb>=10,K=t=>t===13?'c':t===12?'s':'r';
    const rb=Math.floor(b/N),cb=b%N,ra=Math.floor(a/N),ca=a%N;
    const row=r=>{for(let k=0;k<N;k++)set.add(r*N+k)},col=c=>{for(let k=0;k<N;k++)set.add(k*N+c)};
    if(sa&&sb){
      const k=[K(ta),K(tb)].sort().join('');
      g[a]=0;g[b]=0;set.add(a);set.add(b);
      if(k==='cc'){pending=()=>{flash('rgba(255,215,0,.6)');ring(b,16);ring(b,10);shake();sfx('siu');sfx('boom')};g.forEach((v,j)=>set.add(j));msg('Rana\'yı çok seviyorum ❤️');}
      else if(k==='cs'||k==='cr'){const c0=ta===13?a:b,conv=[],so=S[ta===13?b:a];
        const cnt=Array(10).fill(0);g.forEach(v=>{if(v<10)cnt[v]++});
        let m=-1;cnt.forEach((n,t)=>{if(n>0&&(m<0||n<cnt[m]))m=t});
        if(g.some((v,j)=>v===so&&j!==a&&j!==b))m=so;
        g.forEach((v,j)=>{if(v===m&&j!==a&&j!==b){g[j]=k==='cs'?12:(Math.random()<.5?10:11);set.add(j);conv.push(j)}});
        render();if(m>=0)toast(D[m].n+' → '+(k==='cs'?'❤️':'🌹'));conv.forEach(j=>bolt(c0,j));flash('rgba(255,215,0,.35)');sfx('siu');await sleep(550);
      }
      else if(k==='rs'){pending=()=>{beam(b,false,3);beam(b,true,3);ring(b,6);shake();sfx('boom');sfx('whoosh')};for(let d=-1;d<=1;d++){if(rb+d>=0&&rb+d<N)row(rb+d);if(cb+d>=0&&cb+d<N)col(cb+d)}}
      else if(k==='rr'){pending=()=>{beam(b,false,1.6);beam(b,true,1.6);flash('rgba(255,255,255,.45)');sfx('whoosh')};row(rb);col(cb)}
      else{
        pending=()=>{ring(a,4);ring(b,4);ring(b,8);shake();sfx('boom')};
        const hz=ra===rb,cl=(v,n)=>Math.max(0,Math.min(N-n,v));
        const r0=hz?cl(rb-1,3):cl(Math.min(ra,rb)-2,6),c0=hz?cl(Math.min(ca,cb)-2,6):cl(cb-1,3);
        const h=hz?3:6,w=hz?6:3;
        for(let y=0;y<h;y++)for(let x=0;x<w;x++)set.add((r0+y)*N+c0+x);
      }
    }else if(ta===13||tb===13){
      const c=ta===13?a:b,o=ta===13?b:a;pending=()=>{flash('rgba(255,215,0,.4)');ring(c,10);sfx('siu')};
      if(g[o]<9){const t0=g[o],up=[];g.forEach((v,j)=>{if(v===t0){g[j]=t0+1;up.push(j)}});render(null,new Set(up));up.forEach(j=>burst(j,TC[t0+1],5));toast(D[t0].n+' → '+D[t0+1].n+' ⬆️');sfx('chime',4);await sleep(600);g[c]=0;noCount=true}
      else if(g[o]<10){g.forEach((v,j)=>{if(v===g[o])set.add(j)});g[c]=0}
      set.add(c);
    }else{set.add(a);set.add(b)}
    await applyClear(set,new Map(),1);noCount=false;await resolve([]);
  }else if(find.call(null,[a,b])&&(()=>{const r=runs();return r.H.length||r.V.length})()){
    moves--;await resolve([a,b]);
  }else{
    [g[a],g[b]]=[g[b],g[a]];[S[a],S[b]]=[S[b],S[a]];render();
  }
  fixBoard();
  if(moves<=0){best=Math.max(best,score);$('bs').textContent=best;$('ot').textContent='Oyun bitti! Puan: '+score;$('over').style.display='flex'}
  busy=false;
}
let st=null;
const B_=$('board');
B_.addEventListener('pointerdown',e=>{const c=e.target.closest('.c');startMusic();if(!c||busy)return;st={i:+c.dataset.i,x:e.clientX,y:e.clientY}});
B_.addEventListener('pointerup',e=>{
  if(!st||busy){st=null;return}
  const i=st.i,dx=e.clientX-st.x,dy=e.clientY-st.y;st=null;
  const r=Math.floor(i/N),c=i%N;
  if(Math.max(Math.abs(dx),Math.abs(dy))>18){
    let j;if(Math.abs(dx)>Math.abs(dy)){if(c+Math.sign(dx)<0||c+Math.sign(dx)>=N)return;j=i+Math.sign(dx)}
    else{if(r+Math.sign(dy)<0||r+Math.sign(dy)>=N)return;j=i+Math.sign(dy)*N}
    trySwap(i,j);return;
  }
  if(sel===null){sel=i;render()}
  else{const d=Math.abs(sel-i),ok=(d===1&&Math.floor(sel/N)===r)||d===N;
    if(ok){trySwap(sel,i)}else{sel=i;render()}}
});
$('rb').onclick=init;
init();
